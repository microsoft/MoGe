[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "moge"
version = "3.0.0"
description = "MoGe-3: Fine-Detail Monocular Geometry Estimation with Self-Guided Sparse Volumetric Refinement"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "click>=8.3.1",
  "numpy>=2",
  "opencv-python-headless", # ==4.10.0.84 if any issue with OpenCV
  "scipy>=1.8",
  "pillow",
  "matplotlib",
  "trimesh>=4.11",
  "huggingface-hub",
  "requests",
  "tqdm",
  "torch>=2.4",
  "torchvision>=0.19",
  "utils3d_moge @ git+https://github.com/EasternJournalist/utils3d-moge.git@62f09d58509485564e24d5d9f6aac9ee9ebc0c37",
  "pipeline @ git+https://github.com/EasternJournalist/pipeline.git@1c511390d90226c00c101f34b84df26a0f8789b4",
  "flex-gemm @ git+https://github.com/JeffreyXiang/FlexGEMM.git@b2fadb29d41846c7981ade6801ffc689fae119cf",
  "gradio>=6.0",
  "starlette",
]

[project.urls]
Homepage = "https://github.com/microsoft/MoGe"
Repository = "https://github.com/microsoft/MoGe"
Issues = "https://github.com/microsoft/MoGe/issues"

[project.scripts]
moge = "moge.scripts.cli:main"

[project.optional-dependencies]
train = [
  "accelerate>=1.12.0",
  "sympy>=1.12",
  "wandb",
  "tensorboard>=2.14",
  "mlflow>=3.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["moge*"]

[tool.setuptools.package-data]
"moge.utils.gradio_3d_viewer" = ["viewer.html", "assets/*.js", "assets/LICENSE"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# To target a different CUDA version, either change the index URL above, 
# or reinstall into the synced environment with
# `uv pip install --torch-backend=cu128 torch torchvision --reinstall`.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
